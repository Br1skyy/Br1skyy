name: snake evolution

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: Br1skyy
          outputs: |
            output/snake-evolution.svg?color_background=0a0a0a&color_dot_border=0a0a0a&color_dots=1f1f1f,2d2d2d,4a4a4a,6f6f6f,9a9a9a&color_snake=ffffff

      - name: commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "chore: regenerate snake evolution"
          git push